# 风扇 / 机箱 / 电源 · 档位白名单
#
# 设计意图
# --------
# 用户决策：这三个品类不做"全 SKU 爬"，只搜人工精选的知名型号。
#   - 风扇/机箱：按档位收敛（每档 3-5 款），避免被山寨 SKU 淹没
#   - 电源：只留 mid/high 档（entry 档电源安全性风险，不列）
#
# 与 drives_release.yaml 的区别：
#   drives 是"对任何 SKU 尝试匹配"的降级查表；
#   tier_whitelist 是"只搜白名单里的型号"的正向清单，下游 price crawler 据此生成关键词。
#
# 档位含义（统一三品类）：
#   - high:  旗舰/发烧级（风扇：Noctua A12x25 / 电源：海韵 PRIME / 机箱：海盗船 7000X）
#   - mid:   主流中端（电竞玩家常规选择）
#   - entry: 入门（仅风扇/机箱允许；电源品类此档留空，已注释说明）
#
# 数据来源：各品牌中文官网 + JD 自营旗舰店 2026-04 主销型号。
# 数据更新策略：建议半年复查一次，命名保留较宽松（子串匹配）。
#
# schema 参考：query via parse_model.tier_whitelist_models(category)

