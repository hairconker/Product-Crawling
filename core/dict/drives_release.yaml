# 硬盘型号 → 发布年 + 档位映射表
#
# 匹配逻辑（见 parse_model.drives_release_year）：
#   - 对 SKU 名称做 case-insensitive 子串匹配
#   - 同品牌下按列表顺序尝试；**长/具体型号放前面**（如 "990 Evo Plus" 必须在 "990" 前）
#   - 首次命中即返回，不做评分
#
# 数据来源：
#   - Samsung/WD/Crucial/Kingston 等一线品牌官网产品页 + press release
#   - 致态（YMTC）/ 海康 / 铠侠 官网
#   - Wikipedia SSD history 交叉校对
#
# tier 档位约定（用于后续 tier_whitelist 联动）：
#   - high:  高端/旗舰（PCIe 4.0/5.0 顶级 / 高 TBW / DRAM 缓存全满）
#   - mid:   主流（PCIe 3.0/4.0 中端）
#   - entry: 入门（QLC / DRAMless / SATA 预算线）
#
# HDD 覆盖较稀：产品线通常持续多年（BarraCuda/Blue 等 2013 首代至今），按主系列首发年记。

# ---------- SSD · Samsung ----------
samsung:
  - { match: "9100 Pro",          release_year: 2025, tier: high,  form: "M.2 PCIe 5.0" }
  - { match: "990 Evo Plus",      release_year: 2024, tier: mid,   form: "M.2 PCIe 4.0/5.0" }
  - { match: "990 Evo",           release_year: 2024, tier: mid,   form: "M.2 PCIe 4.0/5.0" }
  - { match: "990 Pro",           release_year: 2022, tier: high,  form: "M.2 PCIe 4.0" }
  - { match: "980 Pro",           release_year: 2020, tier: high,  form: "M.2 PCIe 4.0" }
  - { match: "980",               release_year: 2021, tier: mid,   form: "M.2 PCIe 3.0 DRAMless" }
  - { match: "970 Evo Plus",      release_year: 2019, tier: mid,   form: "M.2 PCIe 3.0" }
  - { match: "970 Evo",           release_year: 2018, tier: mid,   form: "M.2 PCIe 3.0" }
  - { match: "970 Pro",           release_year: 2018, tier: high,  form: "M.2 PCIe 3.0" }
  - { match: "960 Pro",           release_year: 2016, tier: high,  form: "M.2 PCIe 3.0" }
  - { match: "960 Evo",           release_year: 2016, tier: mid,   form: "M.2 PCIe 3.0" }
  - { match: "950 Pro",           release_year: 2015, tier: high,  form: "M.2 PCIe 3.0" }
  - { match: "870 Evo",           release_year: 2021, tier: mid,   form: "SATA" }
  - { match: "870 QVO",           release_year: 2020, tier: entry, form: "SATA QLC" }
  - { match: "860 Pro",           release_year: 2018, tier: high,  form: "SATA" }
  - { match: "860 Evo",           release_year: 2018, tier: mid,   form: "SATA" }
  - { match: "860 QVO",           release_year: 2018, tier: entry, form: "SATA QLC" }
  - { match: "850 Pro",           release_year: 2014, tier: high,  form: "SATA" }
  - { match: "850 Evo",           release_year: 2014, tier: mid,   form: "SATA" }
  - { match: "840 Evo",           release_year: 2013, tier: mid,   form: "SATA" }
