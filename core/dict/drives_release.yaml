# ---------- HDD · Western Digital ----------
# pc-part-dataset HDD 名称用 "Western Digital ..." 全称，不是 "WD"
# Red Plus / Red Pro / Gold / Purple / Ultrastar 都是 WD 专属词，不会误匹配
wd_hdd:
  # 用 WD 专属词（Red Plus / Red Pro / Caviar / VelociRaptor / Scorpio），不依赖 "WD" 或 "Western Digital" 前缀
  # 这样 "Western Digital Red Pro" 和 "Western Digital WD Red Pro"（双品牌冗余命名）都能命中
  - { match: "Red Plus",                  release_year: 2020, tier: mid,   form: "SATA NAS CMR" }
  - { match: "Red Pro",                   release_year: 2015, tier: high,  form: "SATA NAS" }
  - { match: "WD Red",                    release_year: 2012, tier: mid,   form: "SATA NAS" }
  - { match: "Western Digital Red",       release_year: 2012, tier: mid,   form: "SATA NAS" }
  - { match: "Western Digital Gold",      release_year: 2016, tier: high,  form: "SATA enterprise" }
  - { match: "Western Digital Black",     release_year: 2013, tier: high,  form: "SATA" }
  - { match: "Western Digital Blue",      release_year: 2013, tier: mid,   form: "SATA" }
  - { match: "Western Digital Purple",    release_year: 2014, tier: mid,   form: "SATA surveillance" }
  - { match: "Western Digital Green",     release_year: 2014, tier: entry, form: "SATA low-power" }
  - { match: "Caviar",                    release_year: 2010, tier: entry, form: "SATA" }   # 老款 WD Caviar Blue/Black/Green
  - { match: "VelociRaptor",              release_year: 2008, tier: high,  form: "SATA 10K RPM" }
  - { match: "Scorpio",                   release_year: 2010, tier: mid,   form: "2.5\" mobile" }
  - { match: "AV-GP",                     release_year: 2010, tier: mid,   form: "SATA AV" }
  - { match: "Ultrastar",                 release_year: 2018, tier: high,  form: "SATA enterprise" }
